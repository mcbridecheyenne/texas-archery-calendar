name: Stats USA Archery vs World Archery
on:
  push:
    branches: [stats-usa-wa]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash stats/probe.sh
      - run: |
          git config user.name "stats-bot"; git config user.email "stats-bot@users.noreply.github.com"
          git add stats/out && git commit -m "stats output [skip ci]" && git push
