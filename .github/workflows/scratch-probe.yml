name: Scratch probe (club feeds)
on:
  push:
    branches: [scratch/club-feed-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node script/scratch/probe.mjs
      - name: Commit results
        if: always()
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -f probe-out
          git commit -m "probe results [skip ci]" || exit 0
          git push
