name: Scratch probe (state sources)
on:
  push:
    branches: [scratch/state-sources-probe]
permissions:
  contents: write
jobs:
  probe:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node probe.mjs
      - name: Commit results
        if: always()
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -f out
          git commit -m "probe results [skip ci]" || exit 0
          git push
