name: NFAA probe
on:
  push:
    branches: [nfaa-probe]
    paths: [".github/workflows/nfaa-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe/pub; cd probe/pub
          curl -s https://mcbridecheyenne.github.io/texas-archery-calendar/events-usa.json | python3 -c "import json,sys;d=json.load(sys.stdin);[print(s['name'],s['status'],s['eventCount'],s['fetchedAt'],s['message']) for s in d['sources'] if s['name'] in ('NFAA','USA Archery')];import collections;print(collections.Counter(e['source'] for e in d['events']));print([ (e['name'],e['city'],e['state']) for e in d['events'] if e['source']=='USA Archery'][:6])" > out.txt
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe && git commit -m "probe output pub" && git push
