# Runs both collectors without publishing anything, so a pull request can show whether
# every source still returns events. Fails when a source comes back with 0 events.
name: Check event sources

on:
  pull_request:
    paths: ["api/**", "script/collect-*.ts", "data/**", ".github/workflows/check-feeds.yml"]
  workflow_dispatch:
  schedule:
    - cron: "41 13 * * 1" # weekly, Mondays 13:41 UTC

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Collect Texas events
        run: node --experimental-strip-types script/collect-events.ts out/events.json | tee texas.log

      - name: Collect nationwide events
        if: always()
        run: node --experimental-strip-types script/collect-usa-events.ts out/events-usa.json | tee usa.log

      - name: Per-source counts
        if: always()
        run: |
          {
            echo "### Texas feed"; echo '```'; cat texas.log; echo '```'
            echo "### Nationwide feed"; echo '```'; cat usa.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const fs = require("fs");
            const files = ["out/events.json", "out/events-usa.json"];
            let bad = 0;
            for (const f of files) {
              if (!fs.existsSync(f)) { bad++; console.log(`::error::${f} was not written`); continue; }
              const { sources } = JSON.parse(fs.readFileSync(f, "utf8"));
              for (const s of sources) {
                const line = `${s.name}: ${s.status}, ${s.eventCount} events${s.message ? ` (${s.message})` : ""} [${f}]`;
                if (!s.eventCount) { bad++; console.log(`::error::${line}`); }
                else console.log(`::notice::${line}`);
              }
            }
            process.exit(bad ? 1 : 0);
          '

