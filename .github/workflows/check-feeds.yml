# Runs both collectors without publishing anything, so a pull request can show whether
# every source still returns events. Fails when a source comes back with 0 events (a club
# calendar that loads with no shoots on it is only a warning).
name: Check event sources

on:
  pull_request:
    paths: ["api/**", "script/collect-*.ts", "script/*.test.ts", "data/**", ".github/workflows/check-feeds.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Club feed parser tests
        run: node --experimental-strip-types --test script/club-feeds.test.ts

      - name: Collect Texas events
        run: node --experimental-strip-types script/collect-events.ts out/events.json | tee texas.log

      - name: Collect nationwide events
        if: always()
        run: node --experimental-strip-types script/collect-usa-events.ts out/events-usa.json | tee usa.log

      - name: Per-source counts
        if: always()
        run: |
          {
            echo "### Texas feed"; echo '```'; cat texas.log; echo '```'
            echo "### Nationwide feed"; echo '```'; cat usa.log; echo '```'
            echo "### Club calendar shoots"
            node -e '
              const fs = require("fs");
              if (!fs.existsSync("out/events-usa.json")) process.exit(0);
              const { events } = JSON.parse(fs.readFileSync("out/events-usa.json", "utf8"));
              console.log("| Club | Dates | Shoot | Organization |\n|---|---|---|---|");
              for (const e of events.filter((e) => e.source === "CLUB"))
                console.log(`| ${e.contact} | ${e.startDate}${e.endDate !== e.startDate ? ` to ${e.endDate}` : ""} | [${e.name}](${e.sourceUrl}) | ${e.organization} |`);
            '
          } >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const fs = require("fs");
            const files = ["out/events.json", "out/events-usa.json"];
            let bad = 0;
            for (const f of files) {
              if (!fs.existsSync(f)) { bad++; console.log(`::error::${f} was not written`); continue; }
              const { sources } = JSON.parse(fs.readFileSync(f, "utf8"));
              for (const s of sources) {
                const line = `${s.name}: ${s.status}, ${s.eventCount} events${s.message ? ` (${s.message})` : ""} [${f}]`;
                // A club calendar that loads but has no shoots right now is only a warning:
                // clubs go quiet between seasons.
                const quietClub = s.name.startsWith("CLUB: ") && s.status === "ok";
                if (!s.eventCount && quietClub) console.log(`::warning::${line}`);
                else if (!s.eventCount) { bad++; console.log(`::error::${line}`); }
                else console.log(`::notice::${line}`);
              }
            }
            process.exit(bad ? 1 : 0);
          '

