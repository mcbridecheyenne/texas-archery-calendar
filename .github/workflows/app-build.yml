name: App build

# Pushing to the app-release branch builds the iPhone app on Expo (EAS) and
# sends it to TestFlight, e.g. `git push origin mobile-app:app-release`.
# Nothing reaches the public App Store until Cheyenne releases it.
on:
  push:
    branches: [app-release]

jobs:
  ios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: eas build --platform ios --profile production --non-interactive --auto-submit
