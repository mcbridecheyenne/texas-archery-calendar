name: App build

# Pushing to the app-release branch builds the iPhone app on Expo (EAS) and
# sends it to TestFlight, e.g. `git push origin mobile-app:app-release`.
# Nothing reaches the public App Store until Cheyenne releases it.
on:
  push:
    branches: [app-release]

jobs:
  ios:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm install -g eas-cli
      - run: eas whoami
      - run: npm ci
      - run: npx tsc --noEmit
      - run: eas build --platform ios --profile production --non-interactive --auto-submit
